[project]
name = "mkl"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "duckdb>=1.0",
  "polars>=1.0",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "lightgbm>=4.5",
  "xgboost>=3.0",
  "catboost>=1.2",
  "pyyaml>=6.0",
  "pyarrow>=16.0",
]

# Веб-часть вынесена в отдельную группу: расчётный контур должен ставиться и
# работать без неё, иначе обучение потянет за собой ASGI-сервер.
[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
mkl = "mkl.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]
