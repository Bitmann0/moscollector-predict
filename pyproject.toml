[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moscollector-predict"
version = "0.1.0"
description = "Сервис предиктивного обслуживания инженерных коллекторов"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scikit-learn>=1.4,<2",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
ml = ["duckdb==1.5.5", "py7zr==1.1.3"]
dev = [
  "httpx>=0.27,<1",
  "pytest>=7.4,<9",
  "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.setuptools.package-data]
app = ["static/*"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
