[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moscollector-predict"
version = "0.2.0"
description = "Сервис диспетчера: прогноз отказов и рисков инженерных коллекторов Москвы"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.13,<2",
  "pydantic-settings>=2.4,<3",
  "itsdangerous>=2.2,<3",
  "python-multipart>=0.0.9",
  "httpx>=0.27,<1",
  "openpyxl>=3.1,<4",
  "fpdf2>=2.8,<3",
  "defusedxml>=0.7,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.6,<1",
  "pypdf>=6,<7",
  "xmlschema>=3,<5",
]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.setuptools.package-data]
app = ["static/**/*", "migrations/**/*", "resources/**/*"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["ml", "frontend", "analysis"]

[tool.ruff.lint.flake8-bugbear]
# Depends/Query/File в аргументах по умолчанию — штатный приём FastAPI, не ошибка.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.File", "fastapi.Body",
                          "fastapi.Header"]

[tool.ruff.lint.per-file-ignores]
# Depends(require_perm("…")) — фабрика зависимости прав, вызывается один раз при объявлении маршрута.
"backend/app/routers/*" = ["B008"]
