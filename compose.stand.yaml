# ЗАГЛУШКА — владелец PM-10 (стенд, решения D9 и D13).
# Заменить: домен и TLS для реальной ВМ, бэкап pg_dump (ML1-13), лимиты ресурсов, журналы.
# Уже живое: сервис replay (ML2-03).
# Контракт: api снаружи доступен только через Caddy (80/443), демо-настройки закрыты;
# scripts/smoke_compose.py --base-url https://$STAND_DOMAIN должен остаться зелёным.
#
#   docker compose -f compose.yaml -f compose.real.yaml -f compose.stand.yaml up -d --build
services:
  api:
    ports: !reset []
    environment:
      DEMO_SETTINGS_LOCKED: "1"
      COOKIE_SECURE: "1"
      # Caddy в той же сети compose: доверяем его X-Forwarded-Proto и X-Forwarded-For.
      FORWARDED_ALLOW_IPS: "*"

  caddy:
    image: caddy:2-alpine
    environment:
      STAND_DOMAIN: ${STAND_DOMAIN:?задайте STAND_DOMAIN в .env - домен стенда}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # Поток событий 30.06 (ML2-03, раздел 3 плана: «Поток 30.06»): на старте догружает
  # события 00:00…сейчас без уведомлений, дальше идёт по часам МСК. Образ ml — ради duckdb
  # для parquet бандла; скрипт и события бандла смонтированы только для чтения.
  # Журнал задержки для ML2-04 — ./state/replay/latency.csv на хосте.
  # История мая–июня для журнала и динамики карточек — разовой командой (README):
  #   docker compose -f compose.yaml -f compose.real.yaml -f compose.stand.yaml \
  #     run --rm replay python /srv/scripts/replay.py --base-url http://api:8000 --bulk
  replay:
    build:
      context: .
      dockerfile: ml/Dockerfile
    command: ["python", "/srv/scripts/replay.py", "--base-url", "http://api:8000",
              "--catch-up", "--align-to-clock", "--loop",
              "--latency-log", "/srv/state/latency.csv"]
    environment:
      INTEGRATION_API_KEY: ${INTEGRATION_API_KEY:?задайте INTEGRATION_API_KEY в .env}
      TZ: Europe/Moscow
    volumes:
      - ./scripts:/srv/scripts:ro
      # replay.py по умолчанию читает <корень>/bundle/data/interim/events_year=2026.parquet;
      # корень скрипта в контейнере — /srv.
      - ${BUNDLE_DIR:-./bundle}/data/interim:/srv/bundle/data/interim:ro
      - ./state/replay:/srv/state
    # HEALTHCHECK образа ml опрашивает :8001, а здесь сервера нет.
    healthcheck:
      disable: true
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
