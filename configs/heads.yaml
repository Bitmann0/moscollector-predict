# Голова A расщеплена на две. Прежняя метка L5 объединяла отказ и молчание, и
# 98.89% её позитивов давала ветка молчания: заявленные 0.700 при полноте 0.633
# были качеством предсказания «канал завтра не отчитается», а не отказа датчика.
# Выдавать это за одно число нельзя — бригада, выехавшая по такому алерту, в
# большинстве случаев приедет к работающему датчику, который пропустил сутки.

A_link:
  title: Потеря связи с каналом
  entity: [ch, day]
  feature_set: sensor
  label: label_link
  # L9 вместо L4: порог пропуска свой у каждого канала, кратный его обычному
  # ритму. Фиксированные «двое суток» считали отказом штатный редкий опрос —
  # 303 617 событий из 982 438 были разрывами ровно в одни сутки.
  variant: L9
  horizon_days: 1
  embargo_days: 31
  budget_per_day: 20
  drop_feature_prefixes: [peer_, nbr_, val_minus_seg_mean]
  params:
    n_estimators: 800
    learning_rate: 0.03
    num_leaves: 255
    min_child_samples: 200

  params_xgb:
    n_estimators: 800
    learning_rate: 0.03
    max_depth: 10
    min_child_weight: 50
  params_cat:
    iterations: 800
    learning_rate: 0.03
    depth: 10
A:
  title: Отказ датчика
  entity: [ch, day]
  feature_set: sensor
  label: label_failure
  # L6 — только устойчивые одиночные отказы. База 0.0026, и это честная
  # редкость события, а не повод подмешивать к нему молчание.
  variant: L6
  horizon_days: 1
  embargo_days: 31
  budget_per_day: 20
  # Ступени B4 и B5 показали, что peer-relative и пространственные признаки
  # ухудшают эту голову: сравнение с соседями шумит там, где вопрос в том,
  # пропадёт ли канал.
  drop_feature_prefixes: [peer_, nbr_, val_minus_seg_mean]
  # Подобрано тюнингом на победившем наборе: Recall 0.584 при Precision 0.700
  # против 0.556 на дефолтных параметрах.
  params:
    n_estimators: 800
    learning_rate: 0.03
    num_leaves: 255
    min_child_samples: 200

  # Эквивалент по ёмкости для GPU-бэкендов: num_leaves 255 это примерно
  # глубина 8, а не дефолтная 6. Без этого XGBoost получил бы вдвое
  # меньшую модель, и сравнение мерило бы ёмкость, а не бэкенд.
  params_xgb:
    n_estimators: 800
    learning_rate: 0.03
    max_depth: 10
    min_child_weight: 50
  params_cat:
    iterations: 800
    learning_rate: 0.03
    depth: 10
A_strict:
  title: Аномалия датчика
  entity: [ch, day]
  feature_set: sensor
  label: label_failure_strict
  horizon_days: 1
  embargo_days: 31
  budget_per_day: 20
  # Отсечка внутри объекта, а не глобально: иначе все алерты
  # оседают на нескольких худших объектах.
  budget_per_object: true

A_deg:
  title: Деградация датчика
  entity: [ch, day]
  feature_set: sensor
  label: label_degradation
  horizon_days: 1
  embargo_days: 31
  budget_per_day: 30
  # Отсечка внутри объекта, а не глобально: иначе все алерты
  # оседают на нескольких худших объектах.
  budget_per_object: true

A_prime:
  title: Массовый отказ объекта
  entity: [obj, day]
  feature_set: object
  label: label_group_outage
  horizon_days: 1
  embargo_days: 31
  budget_per_day: 5

B:
  title: Пожарный риск участка
  entity: [obj, seg, day]
  feature_set: segment
  label: label_fire
  horizon_days: 1
  embargo_days: 31
  budget_per_day: 10

C:
  title: Несанкционированный доступ
  entity: [obj, day]
  feature_set: object
  label: label_intrusion
  horizon_days: 1
  embargo_days: 31
  # Бюджет выбран на валидации (декабрь 2025) по правилу «максимум полноты при
  # точности не ниже 0.70», а не по кривой отложенного периода. На холдауте
  # кривая проходит почти точно через целевую точку ТЗ (7 алертов: 0.704/0.485,
  # 8 алертов: 0.689/0.542), и соблазн взять оттуда бюджет 8 и объявить цель
  # взятой был прямым повторением того дефекта, который этот пайплайн и чинил:
  # выбор параметра по ответам отложенного периода. На валидации цель не
  # берётся ни при каком бюджете до 20.
  budget_per_day: 4
  # Подобрано тюнингом: Precision 0.702 при Recall 0.503 против 0.704 при
  # 0.493 на дефолтных параметрах — этого хватило, чтобы взять цель ТЗ.
  params:
    n_estimators: 1200
    learning_rate: 0.02
    num_leaves: 127

  params_xgb:
    n_estimators: 1200
    learning_rate: 0.02
    max_depth: 7
    min_child_weight: 20
  params_cat:
    iterations: 1200
    learning_rate: 0.02
    depth: 7
D:
  title: Износ агрегатов
  entity: [ch, day]
  feature_set: sensor
  label: label_wear
  horizon_days: 7
  embargo_days: 37
  budget_per_day: 3
  # Отсечка внутри объекта, а не глобально: иначе все алерты
  # оседают на нескольких худших объектах.
  budget_per_object: true

E:
  title: Риск подтопления
  entity: [obj, day]
  feature_set: object
  label: label_flood
  horizon_days: 1
  embargo_days: 31
  budget_per_day: 5
  # контекст комплекса выиграл 1 фолд из 5 — для подтопления это шум:
  # насосные объекты все одного вида, а соседи по комплексу заливаются
  # не вместе, а по своему рельефу
  drop_feature_prefixes: [par_, is_guard_object]

C_armed:
  title: Доступ при включённой охране
  entity: [obj, day]
  feature_set: object
  label: label_intrusion
  # Позитив — тревога проникновения при объекте НА ОХРАНЕ. Тревога при снятой
  # охране это проход персонала, то есть ровно санкционированный доступ, и
  # голова, названная «несанкционированный доступ», считала его позитивом
  # наравне с нарушителем: по всей истории состояние известно у 86.7% тревог и
  # делит их почти пополам.
  #
  # Цена: охрана есть на 47 объектах из 78, и голова работает только по ним.
  # Отчитываться по покрытым и непокрытым объектам следует раздельно.
  armed_only: true
  horizon_days: 1
  embargo_days: 31
  budget_per_day: 4
  params:
    n_estimators: 1200
    learning_rate: 0.02
    num_leaves: 127
  params_xgb:
    n_estimators: 1200
    learning_rate: 0.02
    max_depth: 7
    min_child_weight: 20
  params_cat:
    iterations: 1200
    learning_rate: 0.02
    depth: 7
