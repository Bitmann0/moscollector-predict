# Закреплённые версии образа ml (ml/Dockerfile): python 3.12, linux x86_64 и aarch64.
# Источник — pip freeze окружения CAML (U:\hackathon\.venv), отфильтрованный до
# зависимостей mkl и mkl[api] с транзитивными. Dev-пакеты и Windows-only
# (colorama, tzdata) исключены; uvloop добавлен: uvicorn[standard] ставит его
# только вне Windows.
#
# xgboost-cpu вместо xgboost той же версии 3.4.1: модуль тот же (import xgboost),
# но без CUDA. Пакет xgboost на Linux тянет nvidia-nccl-cu13 (290 МБ) и колесо
# 54 МБ против 5 МБ, а GPU в контейнере нет. mkl ставится с --no-deps, поэтому
# его требование xgboost>=3.0 pip не перепроверяет.
#
# Обновить: поменять пин, проверить колесо под manylinux и cp312, пересобрать образ.
