name: ML experiment checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  temporal-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install reproducible experiment environment
        run: |
          python -m pip install -r requirements-ml.txt
          python -m pip install -e '.[dev]'
      - name: Validate aggregation and temporal isolation on synthetic data
        run: pytest -q tests/test_backtest.py tests/test_ml_prepare.py
